[package]
name = "ntpuvpn-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyconnect = { version = "0.1.1", default-features = false, features = ["static"] }
net-route = "0.4.6"
rpassword = "7.4.0"
serde = { version = "1.0.226", features = ["derive"] }
tokio = { version = "1.47.1", features = ["full"] }
tun = "0.8.14"
serde_json = "1.0.145"
dirs = "6.0.0"
dotenvy = "0.15.7"
network-interface = "2.0.3"

[dev-dependencies]
tempfile = "3"
